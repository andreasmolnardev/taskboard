services:
  slopstack:
    build: .
    ports:
      - "8090:8090"
    environment:
      SLOPSTACK_PUBLIC_URL: http://localhost:8090
      SLOPSTACK_STORAGE_PATH: /app/pb_data
      SLOPSTACK_BACKUP_ENABLED: "true"
      SLOPSTACK_BACKUP_CRON: "0 3 * * *"
      SLOPSTACK_BACKUP_MAX_KEEP: "14"
      SLOPSTACK_BACKUP_S3_ENABLED: "${SLOPSTACK_BACKUP_S3_ENABLED:-false}"
      SLOPSTACK_BACKUP_S3_BUCKET: "${SLOPSTACK_BACKUP_S3_BUCKET:-}"
      SLOPSTACK_BACKUP_S3_REGION: "${SLOPSTACK_BACKUP_S3_REGION:-}"
      SLOPSTACK_BACKUP_S3_ENDPOINT: "${SLOPSTACK_BACKUP_S3_ENDPOINT:-}"
      SLOPSTACK_BACKUP_S3_ACCESS_KEY: "${SLOPSTACK_BACKUP_S3_ACCESS_KEY:-}"
      SLOPSTACK_BACKUP_S3_SECRET: "${SLOPSTACK_BACKUP_S3_SECRET:-}"
      SLOPSTACK_BACKUP_S3_FORCE_PATH_STYLE: "${SLOPSTACK_BACKUP_S3_FORCE_PATH_STYLE:-false}"
    volumes:
      - slopstack-data:/app/pb_data

volumes:
  slopstack-data:
