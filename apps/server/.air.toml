root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/slopstack ./cmd/slopstack"
  entrypoint = ["./tmp/slopstack"]
  full_bin = "SLOPSTACK_DEVELOPMENT=true ./tmp/slopstack serve --http=${SLOPSTACK_HTTP_ADDRESS:-0.0.0.0:8090}"
  include_ext = ["go", "json", "yaml", "yml", "toml"]
  exclude_dir = ["tmp", "pb_data", "node_modules"]

[log]
  time = true
