name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release metadata
        id: image
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { loadProjectConfig } from './scripts/project-config.js';

          const { config } = await loadProjectConfig();
          const expectedTag = `v${config.release.version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`release tag ${process.env.GITHUB_REF_NAME} does not match slopstack.yaml release.version (${config.release.version})`);
          }
          if (config.image.tag !== config.release.version) {
            throw new Error(`image.tag (${config.image.tag}) must match release.version (${config.release.version}); run pnpm release --apply --version ${config.release.version}`);
          }

          console.log(`registry=${config.registry.host}`);
          console.log(`repository=${config.image.repository}`);
          console.log(`platforms=${config.image.platforms.split(',').map((part) => part.trim()).join(',')}`);
          console.log(`tag=${config.image.tag}`);
          console.log(`buildx=${config.tools.dockerBuildx}`);
          NODE
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          version: v${{ steps.image.outputs.buildx }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:latest
