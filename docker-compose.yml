services:
  taskboard:
    build:
      context: .
    ports:
      - "8090:8090"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      TASKBOARD_PUBLIC_URL: "${TASKBOARD_PUBLIC_URL:-${SLOPSTACK_PUBLIC_URL:-http://localhost:8090}}"
      TASKBOARD_STORAGE_PATH: "${TASKBOARD_STORAGE_PATH:-${SLOPSTACK_STORAGE_PATH:-/app/pb_data}}"
      TASKBOARD_BACKUP_ENABLED: "${TASKBOARD_BACKUP_ENABLED:-${SLOPSTACK_BACKUP_ENABLED:-true}}"
      TASKBOARD_BACKUP_CRON: "${TASKBOARD_BACKUP_CRON:-${SLOPSTACK_BACKUP_CRON:-0 3 * * *}}"
      TASKBOARD_BACKUP_MAX_KEEP: "${TASKBOARD_BACKUP_MAX_KEEP:-${SLOPSTACK_BACKUP_MAX_KEEP:-14}}"
      TASKBOARD_BACKUP_S3_ENABLED: "${TASKBOARD_BACKUP_S3_ENABLED:-${SLOPSTACK_BACKUP_S3_ENABLED:-false}}"
      TASKBOARD_BACKUP_S3_BUCKET: "${TASKBOARD_BACKUP_S3_BUCKET:-${SLOPSTACK_BACKUP_S3_BUCKET:-}}"
      TASKBOARD_BACKUP_S3_REGION: "${TASKBOARD_BACKUP_S3_REGION:-${SLOPSTACK_BACKUP_S3_REGION:-}}"
      TASKBOARD_BACKUP_S3_ENDPOINT: "${TASKBOARD_BACKUP_S3_ENDPOINT:-${SLOPSTACK_BACKUP_S3_ENDPOINT:-}}"
      TASKBOARD_BACKUP_S3_ACCESS_KEY: "${TASKBOARD_BACKUP_S3_ACCESS_KEY:-${SLOPSTACK_BACKUP_S3_ACCESS_KEY:-}}"
      TASKBOARD_BACKUP_S3_SECRET: "${TASKBOARD_BACKUP_S3_SECRET:-${SLOPSTACK_BACKUP_S3_SECRET:-}}"
      TASKBOARD_BACKUP_S3_FORCE_PATH_STYLE: "${TASKBOARD_BACKUP_S3_FORCE_PATH_STYLE:-${SLOPSTACK_BACKUP_S3_FORCE_PATH_STYLE:-false}}"
    volumes:
      - slopstack-data:/app/pb_data

volumes:
  slopstack-data:
