root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/taskboard ./cmd/taskboard"
  entrypoint = ["./tmp/taskboard"]
  full_bin = "TASKBOARD_DEVELOPMENT=true ./tmp/taskboard serve --http=${TASKBOARD_HTTP_ADDRESS:-${SLOPSTACK_HTTP_ADDRESS:-0.0.0.0:8090}}"
  include_ext = ["go", "json", "yaml", "yml", "toml"]
  exclude_dir = ["tmp", "pb_data", "node_modules"]

[log]
  time = true
